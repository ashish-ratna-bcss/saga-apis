services:
  # Postgres is NOT run via Docker: the app connects to an existing,
  # already-provisioned external Postgres server (schema:
  # docs/unified_schema.sql, applied out-of-band). Set the real
  # connection string in .env's DATABASE_URL before starting `api` below.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: webintel
      MINIO_ROOT_PASSWORD: webintel12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    # No `alembic upgrade head` step: the schema already exists on the
    # external Postgres server (docs/unified_schema.sql) and must not be
    # auto-created/altered by this app.
    command: uvicorn bluweb_app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: webintel
      MINIO_SECRET_KEY: webintel12345
      MINIO_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      minio:
        condition: service_healthy

# Phase 3 adds: redis + a separate scheduler/worker process for continuous
# monitoring -- not needed until recurring crawls exist, so left out here
# to keep instant-crawl usage (this file) fast and light.

volumes:
  minio_data:
