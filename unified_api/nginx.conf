# Single upstream — every namespace (/scrape, /osint, /reddit, /telegram)
# goes to the same unified API process, per the "one application" mandate.
# TLS termination is left to whatever the operator puts in front of this
# (e.g. a managed load balancer, or add `listen 443 ssl` + cert paths here).
upstream unified_api {
    server unified-api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # OSINT's username lookup ("can take minutes" per its own docs) and
    # Bluweb's /scrape/api/v1/search/instant (blocks server-side up to ~30s)
    # both need generous timeouts — applied globally since it's one upstream.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://unified_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
