# Unified single-process deployment for Bluweb + OSINT + reddit_server +
# telegram_poc. Builds the one image at unified_api/Dockerfile; the four
# existing per-service docker-compose.yml files are untouched and still work
# standalone for single-service development.
#
# Each service's own .env/data stays in its own repo directory on the host
# and is bind-mounted read-only (env) or read-write (persistent data) into
# the container at the same relative path each service's own config already
# expects (BASE_DIR-anchored, see each service's core/config.py).
#
# Not included here: Bluweb's Postgres (external, pre-provisioned per its own
# docs — point BLUWEB .env's DATABASE_URL at it) and MinIO (this host already
# runs one persistently as the `ssor-minio` container — point Bluweb's .env
# MINIO_ENDPOINT at it rather than starting a second instance).
services:
  unified-api:
    build:
      context: .
      dockerfile: unified_api/Dockerfile
    container_name: saga-unified-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./Bluweb/.env:/srv/Bluweb/.env:ro
      - ./Bluweb/storage:/srv/Bluweb/storage
      - ./OSINT/.env:/srv/OSINT/.env:ro
      - ./OSINT/osint.db:/srv/OSINT/osint.db
      # reddit_server ships no real .env — every Settings field has a
      # default (auth disabled, Reddit OAuth unconfigured). Uncomment once
      # real Reddit OAuth credentials / an API_KEYS value exist:
      # - ./reddit_server/.env:/srv/reddit_server/.env:ro
      - ./telegram_poc/.env:/srv/telegram_poc/.env:ro
      - ./telegram_poc/data:/srv/telegram_poc/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/scrape/health', timeout=3).status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: saga-nginx
    restart: unless-stopped
    depends_on:
      unified-api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./unified_api/nginx.conf:/etc/nginx/conf.d/default.conf:ro
